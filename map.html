<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>خارطة التقدم — نورث للمسار المالي</title>
<link rel="icon" href="assets/north-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300..400,0..1,0&display=block">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/ds.css">
<link rel="stylesheet" href="assets/auth.css">
<link rel="stylesheet" href="assets/account.css">
<link rel="stylesheet" href="assets/learn.css">
</head>
<body>

<header class="nav">
  <div class="rail nav-in">
    <a class="brand" href="index.html" aria-label="نورث للمسار المالي، الرئيسية">
      <img class="logo-light" src="assets/north-mark.png" alt="">
      <img class="logo-dark" src="assets/north-mark-white.png" alt="">
      <span><b>NORTH</b><i>للمسار المالي</i></span>
    </a>
    <nav class="nav-links" aria-label="التنقل">
      <a href="index.html">الموقع</a>
      <a href="learn.html">لوحتي</a>
    </nav>
    <div class="nav-act">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="تبديل المظهر"><span class="ms" id="theme-ico">dark_mode</span></button>
      <a class="btn btn-ghost btn-sm" href="login.html">تسجيل الدخول</a>
    </div>
  </div>
</header>

<nav class="lnav" id="lnav" aria-label="أقسام المتعلم"></nav>

<div class="rail gate" id="gate" hidden></div>

<main class="rail lrn" id="shell" hidden>

  <section class="map-hero nsec">
    <span class="ntile"><span class="ms">map</span></span>
    <h1 class="n-h1">خارطة الطريق إلى الاحتراف</h1>
    <p class="n-sub" id="m-sub">—</p>
    <p class="map-meta" id="m-meta"></p>
    <div class="nbar-row"><span id="m-left">—</span><span>التقدم الإجمالي</span></div>
    <div class="nbar"><i id="m-fill" style="width:0%"></i></div>
  </section>

  <section class="ncard nsec">
    <div class="nhead"><span class="ms">schedule</span><h2>ملخص المحتوى المتاح</h2></div>
    <div class="map-tiles" id="m-tiles"></div>
  </section>

  <div id="m-current"></div>
  <div id="map"></div>
  <div id="m-other"></div>

  <!-- ما ينتظرها بعد هذا كله -->
  <div id="m-ahead"></div>

  <section class="ncard next-card nsec" id="m-next" hidden>
    <span class="ntile ok"><span class="ms">emoji_events</span></span>
    <div>
      <h2 class="n-h2">خطوتك التالية</h2>
      <p class="n-sub">أكمل الدروس المفتوحة في مستواك الحالي ثم انتقل للمستوى التالي.</p>
    </div>
    <a class="nbtn nbtn-p" id="m-go" href="#">متابعة التعلم</a>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="assets/supabase.js"></script>
<script src="assets/nav-session.js"></script>
<script src="assets/bell.js"></script>
<script src="assets/learn-core.js"></script>
<script src="assets/learn-nav.js"></script>
<script src="assets/map.js"></script>
</body>
</html>
