<link rel="icon" href="assets/north-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">

<body>

<header class="lhead" id="lhead"></header>

<div class="lmenu" id="lnav" hidden></div>

<div class="rail gate" id="gate" hidden></div>

<main class="rail lrn" id="shell" hidden>

  <section class="map-hero nsec">
    <span class="ntile"><span class="ms">map</span></span>
    <h1 class="n-h1">خارطة الطريق إلى الاحتراف</h1>
    <p class="n-sub" id="m-sub">—</p>
    <p class="map-meta" id="m-meta"></p>
    <div class="nbar-row"><span id="m-left">—</span><span>التقدم الإجمالي</span></div>
    <div class="nbar"><i id="m-fill" style="width:0%"></i></div>
  </section>

  <section class="ncard nsec">
    <div class="nhead"><span class="ms">schedule</span><h2>ملخص المحتوى المتاح</h2></div>
    <div class="map-tiles" id="m-tiles"></div>
  </section>

  <!-- المستويات وحدها: الدروس مكانها صفحة «الدروس» -->
  <div id="m-current"></div>
  <div id="m-other"></div>

  <!-- ما ينتظرها بعد هذا كله -->
  <div id="m-ahead"></div>

  <!-- متابعة التعلم في الخارطة بابٌ إلى المنهج كله، لا قفزةٌ إلى
       الدرس التالي: من أنهت درساً فنُقلت تلقائياً إلى ما بعده تحتاج
       طريقاً ترجع منه. القفزة إلى الدرس الحالي مكانها الرئيسية. -->
  <section class="ncard next-card nsec" id="m-next" hidden>
    <span class="ntile ok"><span class="ms">emoji_events</span></span>
    <div>
      <h2 class="n-h2">خطوتك التالية</h2>
      <p class="n-sub">أكملي الدروس المفتوحة في مستواك الحالي ثم انتقلي تدريجياً
        للمستوى التالي.</p>
    </div>
    <!-- يفتح صفحة «الدروس»: المنهج كلّه بطاقةً بطاقة مقسَّماً
         بالمستوى. لا يقفز إلى الدرس التالي — القفزة مكانها بطاقة
         «تابع التعلم» في الرئيسية. -->
    <a class="nbtn nbtn-p" id="m-go" href="lessons.html">
      <span class="ms">auto_awesome</span>متابعة التعلم</a>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>

<script src="assets/bell.js"></script>
<script src="assets/learn-core.js"></script>
<script src="assets/map.js"></script>
</body>
</html>
