<header class="lhead" id="lhead"></header>

<div class="lmenu" id="lnav" hidden></div>

<div class="rail gate" id="gate" hidden></div>

<main class="rail lrn" id="shell" hidden>

  <section class="lhero">
    <a class="lhero-back" href="map.html">العودة للخارطة<span class="ms">arrow_back</span></a>
    <div class="lhero-chips" id="l-chips"></div>
    <h1 id="l-title">—</h1>
    <!-- وصف الدرس في رأسه: تقرؤه قبل أن تضغط «الفيديو» فتعرف
         ما ستأخذه. كان لا يُعرض هنا أصلاً. -->
    <p class="lhero-d" id="l-desc" hidden></p>
    <div class="lhero-cards" id="l-cards" hidden>
      <div class="lhero-c" id="l-time" hidden><span>الوقت</span><b id="l-time-v">—</b></div>
      <div class="lhero-c">
        <span>هل شاهدت الدرس؟</span>
        <button class="btn btn-primary" id="l-done" type="button">
          <span class="spin" aria-hidden="true"></span><span data-label>تحديد كمشاهد</span>
        </button>
      </div>
    </div>
  </section>

  <div id="l-locked" hidden></div>

  <div id="l-body" hidden>
    <div class="ltabs" id="l-tabs" role="tablist" aria-label="أقسام الدرس"></div>

    <section class="lbox lpane" id="pane-video" role="tabpanel" hidden>
      <div id="l-video"></div>
    </section>

    <section class="lbox lpane" id="pane-vocab" role="tabpanel" hidden>
      <h2><span class="ms">menu_book</span> المفردات</h2>
      <div class="vocab" id="l-vocab"></div>
    </section>

    <!-- «الملخص» نصّ الدرس المكتوب. وصفه القصير مكانه الرأس فوق،
         فلا يُقال مرّتين في صفحةٍ واحدة. -->
    <section class="lbox lpane" id="pane-summary" role="tabpanel" hidden>
      <h2><span class="ms">description</span> الملخص</h2>
      <div class="prose" id="l-content"></div>
    </section>

    <section class="lbox lpane quiz-cta" id="pane-quiz" role="tabpanel" hidden>
      <span class="ntile ok"><span class="ms">psychology</span></span>
      <h2>جاهز للتأكد من فهمك؟</h2>
      <p>بعد مشاهدة الفيديو ومراجعة المفردات والملخص، اختبر نفسك
        بأسئلة قصيرة مرتبطة بهذا الدرس.</p>
      <a class="btn btn-primary" id="l-quiz" href="#">اختبر نفسك</a>
    </section>

    <div class="lesson-nav">
      <a class="btn btn-ghost" id="l-prev" href="#">الدرس السابق</a>
      <a class="btn btn-ghost" id="l-next" href="#">الدرس التالي</a>
    </div>
