<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحتي — نورث للمسار المالي</title>
<link rel="icon" href="assets/north-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300..400,0..1,0&display=block">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/ds.css">
<link rel="stylesheet" href="assets/auth.css">
<link rel="stylesheet" href="assets/account.css">
<link rel="stylesheet" href="assets/learn.css">
</head>
<body>

<header class="nav">
  <div class="rail nav-in">
    <a class="brand" href="index.html" aria-label="نورث للمسار المالي، الرئيسية">
      <img class="logo-light" src="assets/north-mark.png" alt="">
      <img class="logo-dark" src="assets/north-mark-white.png" alt="">
      <span><b>NORTH</b><i>للمسار المالي</i></span>
    </a>
    <nav class="nav-links" aria-label="التنقل">
      <a href="index.html">الموقع</a>
      <a href="learn.html">لوحتي</a>
    </nav>
    <div class="nav-act">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="تبديل المظهر"><span class="ms" id="theme-ico">dark_mode</span></button>
      <a class="btn btn-ghost btn-sm" href="login.html">تسجيل الدخول</a>
    </div>
  </div>
</header>

<nav class="lnav" id="lnav" aria-label="أقسام المتعلم"></nav>

<div class="rail gate" id="gate" hidden></div>

<main class="rail lrn" id="shell" hidden>

  <!-- ١) سلسلة التعلم -->
  <section class="streak-card nsec">
    <div class="streak-in">
      <div class="streak-fire"><span class="ms">local_fire_department</span></div>
      <div class="streak-txt">
        <b id="st-n">—</b>
        <span id="st-lbl">يوم متتالٍ</span>
        <p id="st-msg">—</p>
      </div>
      <div class="week" id="week" role="list"></div>
    </div>
  </section>

  <!-- ٢) ملخص المستوى -->
  <section class="nstats nsec" id="summary" aria-label="ملخص مستواك"></section>

  <!-- ٣) دليل المبتدئين — ثابت للجميع، لا يرتبط بتقدّم ولا بباقة -->
  <section class="ncard nsec gd-box" id="guide-box" hidden>
    <button class="gd-h" type="button" id="guide-toggle"
            aria-expanded="true" aria-controls="guide">
      <span class="ntile"><span class="ms">lightbulb</span></span>
      <h2>دليل المبتدئين</h2>
      <span class="ms gd-c">expand_less</span>
    </button>
    <div id="guide" class="gd-body"></div>
  </section>

  <div class="ngrid nsec">
    <div>
      <!-- ٤) مهام اليوم -->
      <section class="ncard">
        <div class="nhead"><span class="ms">assignment</span><h2>مهام اليوم</h2></div>
        <div id="tasks"></div>
      </section>

      <!-- ٦) تابع التعلم -->
      <section class="ncard" id="resume-box"></section>

      <!-- ٨) خارطة التقدم -->
      <section class="ncard">
        <div class="nhead"><span class="ms">map</span><h2>خارطة التقدم</h2>
          <span class="n-right"><a class="n-link" href="map.html">عرض الخارطة</a></span>
        </div>
        <div id="map-mini"></div>
      </section>
    </div>

    <div>
      <!-- ٥) نشاط المتعلم -->
      <section class="ncard">
        <div class="nhead"><span class="ms">calendar_month</span><h2>نشاطك</h2></div>
        <div id="activity"></div>
      </section>

      <!-- ٧) آخر إشعار -->
      <section class="ncard">
        <div class="nhead"><span class="ms">notifications</span><h2>آخر إشعار</h2></div>
        <div id="last-note"></div>
      </section>

      <section class="ncard">
        <div class="nhead"><span class="ms">quiz</span><h2>الاختبارات</h2></div>
        <div id="quizzes"></div>
      </section>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="assets/supabase.js"></script>
<script src="assets/nav-session.js"></script>
<script src="assets/bell.js"></script>
<script src="assets/learn-core.js"></script>
<script src="assets/learn-nav.js"></script>
<script src="assets/learn.js"></script>
</body>
</html>
