<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحتي — نورث للمسار المالي</title>
<link rel="icon" href="assets/north-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Cormorant+Garamond:wght@600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300..400,0..1,0&display=block">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/auth.css">
<link rel="stylesheet" href="assets/account.css">
<link rel="stylesheet" href="assets/learn.css">
</head>
<body>

<header class="nav">
  <div class="rail nav-in">
    <a class="brand" href="index.html" aria-label="نورث للمسار المالي، الرئيسية">
      <img class="logo-light" src="assets/north-mark.png" alt="">
      <img class="logo-dark" src="assets/north-mark-white.png" alt="">
      <span><b>NORTH</b><i>للمسار المالي</i></span>
    </a>
    <nav class="nav-links" aria-label="التنقل">
      <a href="index.html">الموقع</a>
      <a href="learn.html">لوحتي</a>
    </nav>
    <div class="nav-act">
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="تبديل المظهر"><span class="ms" id="theme-ico">dark_mode</span></button>
      <a class="btn btn-ghost btn-sm" href="login.html">تسجيل الدخول</a>
    </div>
  </div>
</header>

<nav class="lnav" id="lnav" aria-label="أقسام المتعلم"></nav>

<div class="rail gate" id="gate" hidden></div>

<main class="rail lrn" id="shell" hidden>

  <div class="hello">
    <div>
      <h1 id="hi">—</h1>
      <p class="sub" id="hi-sub">—</p>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <!-- 1) سلسلة التعلم اليومية -->
  <section class="lbox streak-box">
    <h2><span class="ms">local_fire_department</span> سلسلة التعلم</h2>
    <div id="streak"></div>
  </section>

  <!-- 2) ملخص مستوى المتعلم -->
  <section class="sum" id="summary" aria-label="ملخص مستواك"></section>

  <!-- 6) تابع التعلم -->
  <div id="resume-box"></div>

  <div class="lgrid">
    <div>
      <!-- 4) مهام اليوم -->
      <section class="lbox">
        <h2><span class="ms">checklist</span> مهام اليوم</h2>
        <div id="tasks"></div>
      </section>

      <!-- 5) نشاط المتعلم -->
      <section class="lbox">
        <h2><span class="ms">insights</span> نشاطك
          <span class="seg" id="act-range" role="group" aria-label="مدى العرض"></span>
        </h2>
        <div id="activity"></div>
      </section>

      <!-- 8) خارطة التقدم -->
      <section class="lbox">
        <h2><span class="ms">map</span> خارطة التقدم</h2>
        <div id="map-mini"></div>
      </section>
    </div>

    <div>
      <!-- 7) آخر إشعار -->
      <section class="lbox">
        <h2><span class="ms">notifications</span> آخر إشعار</h2>
        <div id="last-note"></div>
      </section>

      <!-- 3) دليل المبتدئين -->
      <section class="lbox" id="guide-box" hidden>
        <h2><span class="ms">explore</span> دليل المبتدئين</h2>
        <div id="guide"></div>
      </section>

      <section class="lbox">
        <h2><span class="ms">quiz</span> الاختبارات</h2>
        <div id="quizzes"></div>
      </section>
    </div>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="assets/supabase.js"></script>
<script src="assets/nav-session.js"></script>
<script src="assets/bell.js"></script>
<script src="assets/learn-core.js"></script>
<script src="assets/learn-nav.js"></script>
<script src="assets/learn.js"></script>
</body>
</html>
