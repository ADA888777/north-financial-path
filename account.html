<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>حسابي — نورث للمسار المالي</title>
<link rel="icon" href="assets/north-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300..400,0..1,0&display=block">
<link rel="stylesheet" href="assets/app.css">
<link rel="stylesheet" href="assets/ds.css">
<link rel="stylesheet" href="assets/learn.css">
<link rel="stylesheet" href="assets/auth.css">
<link rel="stylesheet" href="assets/account.css">
</head>
<body>

<header class="lhead" id="lhead"></header>

<div class="lmenu" id="lnav" hidden></div>

<div class="rail gate" id="gate" hidden></div>

<main class="rail acct-main" id="shell" hidden>

  <div class="welcome">
    <div>
      <p class="pill">حسابك</p>
      <h1 id="hero-name">—</h1>
      <p class="lede" id="hero-sub">—</p>
    </div>
    <div class="idcard">
      <span>رقم العضوية</span>
      <b class="num" id="hero-no">—</b>
    </div>
  </div>

  <div class="acct-grid">
    <section class="acct-box">
      <h2>بيانات الحساب</h2>
      <dl class="acct-rows wide" id="view-rows">
        <!-- «حالة الحساب» و«تاريخ الانضمام» معلومتا إدارة لا تخصّان
             العميلة، فرُفعتا. والاسم يحمل رقم عضويته، فلا صفّ له. -->
        <div><dt>الاسم الكامل</dt><dd id="d-name">—</dd></div>
        <div><dt>البريد الإلكتروني</dt><dd class="num" id="d-email">—</dd></div>
      </dl>

    </section>

    <section class="acct-box" id="ent-box" hidden>
      <h2>ما تشمله باقتك</h2>
      <div id="ent"></div>
    </section>

    <section class="acct-box">
      <h2>الاشتراك</h2>
      <div class="sub-state" id="sub-state">
        <span class="ms" id="sub-ico">hourglass_top</span>
        <b id="sub-title">جارٍ التحميل…</b>
        <p id="sub-note"></p>
      </div>
      <dl class="acct-rows wide">
        <div><dt>الباقة</dt><dd id="d-plan">—</dd></div>
        <div><dt>ينتهي في</dt><dd id="d-expires">—</dd></div>
      </dl>
      <a class="btn btn-primary btn-wide" id="renew" href="https://salla.sa/northacademy" target="_blank" rel="noopener noreferrer" hidden>تجديد الاشتراك</a>
    </section>
  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="assets/supabase.js"></script>
<script src="assets/learn-nav.js"></script>
<script src="assets/bell.js"></script>
<script src="assets/account.js"></script>
<script src="assets/entitlements.js"></script>
</body>
</html>
